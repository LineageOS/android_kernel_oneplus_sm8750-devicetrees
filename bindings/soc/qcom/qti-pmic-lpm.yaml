%YAML 1.2
---
$id: http://devicetree.org/schemas/soc/qcom/qti-pmic-lpm.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Qualcomm PMIC low power mode (PMIC LPM)

maintainers:
  - Kamal Wadhwa <quic_kamalw@quicinc.com>
  - Rakesh Kota <quic_kotarake@quicinc.com>
  - Jishnu Prakash <quic_jprakash@quicinc.com>

description: |
  Qualcomm Technologies, Inc. PMIC low power mode (PMIC LPM) reports entry and
  exit of PMIC's low power modes DeepSleep/Hibernate/TWM to a companion chip
  through the SDAM interface.

properties:
  compatible:
    const: qcom,pmic-lpm

  reg:
    description: Base address of the SDAM peripheral.
    maxItems: 1

required:
  - compatible
  - reg

unevaluatedProperties: false

examples:
  - |
    spmi_bus {
      #address-cells = <2>;
      #size-cells = <0>;

      qcom,pm5100@0 {
        #address-cells = <1>;
        #size-cells = <0>;

        pmic-lpm@7200 {
          compatible = "qcom,pmic-lpm";
          reg = <0x7200>;
        };
      };
    };
...
